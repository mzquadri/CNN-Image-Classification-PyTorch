name: Repository check

on:
  push:
  pull_request:

# Read-only is all this workflow needs: it checks out the code, runs checks and
# publishes nothing. Declared rather than inherited, per GitHub's "Security
# hardening for GitHub Actions".
permissions:
  contents: read

# Continuous integration does not train anything. Both networks need a GPU and a
# 170 MB dataset download, so they are run by hand and their results committed.
# What CI checks instead is that the recorded metrics still follow from the
# predictions stored beside them, that the model definition still has the
# parameter count the README quotes, and that the README still matches the
# results file. None of that needs a GPU.
jobs:
  check:
    runs-on: ubuntu-latest
    # Nothing here trains, so the whole job is a few minutes. Without this the
    # default is six hours, which is a long time to spend on a hung install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          # Keyed on requirements.txt, which pins every version. The CPU torch
          # wheel is the bulk of the install, so caching it is most of the run.
          cache: pip

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

      - name: Files present, parameters match, README matches the results
        run: python scripts/check_repository.py

      - name: Tests
        run: python -m unittest discover -s tests

      # Three of the four. 04_failure_examples.png draws real CIFAR-10 images, so
      # without the dataset it cannot be redrawn and the generator skips it here.
      - name: Three of the four figures still render
        run: python scripts/figures/generate_figures.py
