<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#ffffff"/>

  <text x="470" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">Custom CNN for CIFAR-10</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#64748b">Three convolutional blocks with batch normalization, 815,018 trainable parameters</text>

  <!-- Input -->
  <rect x="24" y="110" width="110" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="79" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Input</text>
  <text x="79" y="170" text-anchor="middle" font-size="11" fill="#166534">3 &#215; 32 &#215; 32</text>
  <text x="79" y="188" text-anchor="middle" font-size="10" fill="#4d7c0f">augmented crops</text>

  <!-- Block 1 -->
  <rect x="178" y="90" width="150" height="140" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="253" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">Conv Block 1</text>
  <text x="253" y="134" text-anchor="middle" font-size="10.5" fill="#5b21b6">2 &#215; [Conv3&#215;3 3&#8594;32</text>
  <text x="253" y="150" text-anchor="middle" font-size="10.5" fill="#5b21b6">+ BatchNorm + ReLU]</text>
  <text x="253" y="166" text-anchor="middle" font-size="10.5" fill="#5b21b6">MaxPool + Dropout .25</text>
  <text x="253" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">32 &#215; 16 &#215; 16</text>

  <!-- Block 2 -->
  <rect x="372" y="90" width="150" height="140" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="447" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">Conv Block 2</text>
  <text x="447" y="134" text-anchor="middle" font-size="10.5" fill="#5b21b6">2 &#215; [Conv3&#215;3 32&#8594;64</text>
  <text x="447" y="150" text-anchor="middle" font-size="10.5" fill="#5b21b6">+ BatchNorm + ReLU]</text>
  <text x="447" y="166" text-anchor="middle" font-size="10.5" fill="#5b21b6">MaxPool + Dropout .25</text>
  <text x="447" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">64 &#215; 8 &#215; 8</text>

  <!-- Block 3 -->
  <rect x="566" y="90" width="150" height="140" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="641" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">Conv Block 3</text>
  <text x="641" y="134" text-anchor="middle" font-size="10.5" fill="#5b21b6">2 &#215; [Conv3&#215;3 64&#8594;128</text>
  <text x="641" y="150" text-anchor="middle" font-size="10.5" fill="#5b21b6">+ BatchNorm + ReLU]</text>
  <text x="641" y="166" text-anchor="middle" font-size="10.5" fill="#5b21b6">MaxPool + Dropout .25</text>
  <text x="641" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">128 &#215; 4 &#215; 4</text>

  <!-- Classifier -->
  <rect x="760" y="90" width="156" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="838" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Classifier</text>
  <text x="838" y="134" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Flatten 2048</text>
  <text x="838" y="150" text-anchor="middle" font-size="10.5" fill="#1d4ed8">FC 256 + ReLU</text>
  <text x="838" y="166" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Dropout 0.5 &#8594; FC 10</text>
  <text x="838" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">10 classes</text>

  <!-- Arrows -->
  <line x1="136" y1="160" x2="174" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="160" x2="368" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="524" y1="160" x2="562" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="718" y1="160" x2="756" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Training strip -->
  <rect x="24" y="262" width="892" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="285" font-size="11.5" font-weight="600" fill="#334155">Training:</text>
  <text x="48" y="303" font-size="11" fill="#475569">Adam (wd 1e-4) &#183; OneCycleLR max 0.002 &#183; batch 128 &#183; 12 epochs &#183; RandomCrop / HFlip / ColorJitter</text>
  <text x="560" y="285" font-size="11.5" font-weight="600" fill="#334155">Reference run:</text>
  <text x="560" y="303" font-size="11" fill="#475569">15K samples &#183; ~17 min on MX330 laptop GPU</text>

  <!-- Results strip. Every badge here is the original run, and says so: the README
       opens with the seeded reproduction instead, and two unlabelled accuracies a
       paragraph apart read as a contradiction rather than as two runs. -->
  <rect x="24" y="336" width="892" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="357" font-size="11" fill="#475569">Original run, from results/test_results.json. With every generator seeded, the same configuration reproduces to 63.82%.</text>

  <rect x="48" y="366" width="180" height="32" rx="16" fill="#f0fdf4"/>
  <text x="138" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Test accuracy 64.26%</text>

  <rect x="244" y="366" width="196" height="32" rx="16" fill="#eff6ff"/>
  <text x="342" y="387" text-anchor="middle" font-size="12" fill="#1d4ed8">Best: automobile 82.0%</text>

  <rect x="456" y="366" width="172" height="32" rx="16" fill="#fff7ed"/>
  <text x="542" y="387" text-anchor="middle" font-size="12" fill="#c2410c">Hardest: cat 33.5%</text>

  <rect x="644" y="366" width="248" height="32" rx="16" fill="#fdf2f8"/>
  <text x="768" y="387" text-anchor="middle" font-size="12" fill="#be185d">Seeded reproduction 63.82%</text>
</svg>
